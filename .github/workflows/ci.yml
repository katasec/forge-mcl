name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Verify source provenance and boundaries
        shell: pwsh
        run: |
          ./eng/import/verify.ps1
          ./eng/verify-boundaries.ps1
      - name: Restore locked dependencies
        run: dotnet restore src/ForgeMission.Mcl.slnx --locked-mode
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and deterministic test suite
        run: |
          dotnet build src/ForgeMission.Mcl.slnx -c Release --no-restore
          dotnet test src/ForgeMission.Mcl.slnx -c Release --no-restore --filter "FullyQualifiedName!~GrokWebSearchIntegrationTests"
      - name: Pack and validate private package metadata
        run: |
          dotnet pack src/ForgeMission.Mcl.slnx -c Release --no-build --output artifacts/packages
          pwsh ./eng/verify-packages.ps1
      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Publish Linux Native AOT CLI
        run: |
          dotnet publish src/ForgeMission.Cli/ForgeMission.Cli.csproj -c Release -r linux-x64 --no-restore -o artifacts/forge-linux-x64
          sha256sum artifacts/forge-linux-x64/forge | tee artifacts/forge-linux-x64/forge.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: forge-linux-x64-${{ github.sha }}
          path: artifacts/forge-linux-x64
