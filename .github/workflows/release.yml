name: Release CLI

on:
  pull_request:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event_name == 'pull_request_target' && 'releases' || github.run_id }}
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Reserve release identity
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: make release-prepare

  build:
    needs: prepare
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.prepare.result == 'success') }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      CLI_OUTPUT: dist/cli
      NUGET_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'
      - name: Install native prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 brotli
      - name: Install native prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang zlib1g-dev
      - name: Install Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      - name: Build and verify native release payload
        run: make cli-script-test cli-package
      - name: Preserve failed macOS native probe evidence
        if: ${{ failure() && runner.os == 'macOS' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-exec-diagnostics-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/cli/exec-probe-crashreports
            dist/cli/exec-probe-run.log
            dist/cli/exec-probe-publish.log
            dist/cli/exec-probe/ForgeMission.Exec.Probe
            dist/cli/exec-probe/ForgeMission.Exec.Probe.dSYM
            dist/cli/exec-probe/libonnxruntime.dylib
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: forge-${{ matrix.rid }}
          path: dist/cli/forge-*.zip*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      CLI_OUTPUT: dist/release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: forge-*
          merge-multiple: true
          path: dist/release
      - name: Publish verified release
        run: make release-publish
