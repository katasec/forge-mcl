name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (major.minor.patch, without v)'
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ github.sha }}
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build:
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
            binary: forge
          - os: ubuntu-latest
            rid: linux-x64
            binary: forge
          - os: windows-11-arm
            rid: win-arm64
            binary: forge.exe
    runs-on: ${{ matrix.os }}
    env:
      RID: ${{ matrix.rid }}
      BINARY: ${{ matrix.binary }}
    steps:
      - name: Require a valid version and default-branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be major.minor.patch, without v." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Release must be dispatched from the default branch." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Install AOT prerequisites (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 brotli

      - name: Install AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Publish native AOT with release identity
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        run: dotnet publish src/ForgeMission.Cli -c Release -r "$env:RID" -o dist "-p:Version=$env:VERSION" "-p:SourceRevisionId=$env:SOURCE_SHA" -warnaserror

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/forge

      - name: Archive publish output (macOS and Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && zip -r "$RUNNER_TEMP/forge-$RID.zip" .)

      - name: Archive publish output (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "forge-$env:RID.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path dist).Path, $archive)

      - name: Checksum and check native help/version
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "forge-$env:RID.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  forge-$env:RID.zip" | Set-Content -Encoding ascii "$archive.sha256"
          $binary = (Resolve-Path "dist/$env:BINARY").Path
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw 'Native --help failed.' }
          $version = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "$env:VERSION+$env:SOURCE_SHA") {
            throw "Native version/source mismatch: $version"
          }

      - name: Upload verified payload for release attachment
        uses: actions/upload-artifact@v7
        with:
          name: forge-${{ matrix.rid }}
          path: ${{ runner.temp }}/forge-${{ matrix.rid }}.zip*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: forge-*
          merge-multiple: true
          path: dist

      - name: Publish the new release with all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          if [[ -n "$existing_tag" ]]; then
            echo "Tag $tag already exists; releases are not overwritten." >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "$tag" --generate-notes \
            dist/forge-osx-arm64.zip dist/forge-osx-arm64.zip.sha256 \
            dist/forge-linux-x64.zip dist/forge-linux-x64.zip.sha256 \
            dist/forge-win-arm64.zip dist/forge-win-arm64.zip.sha256
