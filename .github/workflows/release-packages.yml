name: Release private packages

on:
  push:
    tags: [mcl-v*]

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          fetch-tags: false
      - name: Resolve immutable annotated release tag
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^mcl-v\d+\.\d+\.\d+$') { throw "Unexpected release tag: $tag" }
          $release = ./eng/release/resolve-release-tag.ps1 -Tag $tag -Checkout
          $train = "eng/release/trains/$tag.json"
          if (-not (Test-Path -LiteralPath $train)) { throw "Missing release train: $train" }
          "tag=$tag" | Add-Content -Path $env:GITHUB_OUTPUT
          "commit=$($release.Commit)" | Add-Content -Path $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Verify provenance and locked build
        shell: pwsh
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./eng/import/verify.ps1
          ./eng/verify-boundaries.ps1
          dotnet restore src/ForgeMission.Mcl.slnx --locked-mode
          $train = "eng/release/trains/${{ steps.release.outputs.tag }}.json"
          ./eng/release/build-release-train.ps1 -TrainManifestPath $train -RepositoryCommit ${{ steps.release.outputs.commit }}
          dotnet test src/ForgeMission.Mcl.slnx -c Release --no-restore --no-build --filter "FullyQualifiedName!~GrokWebSearchIntegrationTests"
      - name: Pack and validate release metadata
        shell: pwsh
        run: |
          $train = "eng/release/trains/${{ steps.release.outputs.tag }}.json"
          ./eng/release/pack-release-train.ps1 -TrainManifestPath $train -PackageDirectory artifacts/packages -RepositoryCommit ${{ steps.release.outputs.commit }}
          ./eng/verify-packages.ps1 -PackageDirectory artifacts/packages -RepositoryCommit ${{ steps.release.outputs.commit }} -TrainManifestPath $train
      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Publish Linux Native AOT CLI
        shell: pwsh
        run: |
          $train = "eng/release/trains/${{ steps.release.outputs.tag }}.json"
          ./eng/release/publish-release-train-aot.ps1 -TrainManifestPath $train -RepositoryCommit ${{ steps.release.outputs.commit }} -RuntimeIdentifier linux-x64 -OutputDirectory artifacts/forge-linux-x64
          sha256sum artifacts/forge-linux-x64/forge | tee artifacts/forge-linux-x64/forge.sha256
      - name: Publish private package set
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./eng/release/publish-packages.ps1 `
            -PackageDirectory artifacts/packages `
            -RepositoryCommit ${{ steps.release.outputs.commit }} `
            -ReleaseTag ${{ steps.release.outputs.tag }} `
            -TrainManifestPath eng/release/trains/${{ steps.release.outputs.tag }}.json `
            -ManifestPath artifacts/release/${{ steps.release.outputs.tag }}-packages.json
      - name: Create private release evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" "artifacts/release/${{ steps.release.outputs.tag }}-packages.json" --repo katasec/forge-mcl --target "${{ steps.release.outputs.commit }}" --title "MCL packages ${{ steps.release.outputs.tag }}" --notes "Private package manifest for ${{ steps.release.outputs.commit }}."
